# =============================================================================
# Nginx + Certbot stack — reverse proxy and TLS termination
# Shares sales-ai-network with the app stack
# =============================================================================

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    networks:
      - sales-ai-network
    # Background reload loop — picks up renewed certs without downtime
    command: >
      /bin/sh -c "
      nginx -g 'daemon off;' &
      NGINX_PID=$$!
      while true; do
        sleep 6h
        nginx -s reload
      done
      wait $$NGINX_PID
      "

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    networks:
      - sales-ai-network
    # Renew loop — attempts renewal every 12h, only actually renews near expiry
    entrypoint: >
      /bin/sh -c "
      trap 'exit 0' TERM INT
      while true; do
        certbot renew --quiet
        sleep 12h
      done
      "
    # certbot stays running so the container doesn't exit

volumes:
  certbot-www:
  certbot-conf:

networks:
  sales-ai-network:
    external: true
